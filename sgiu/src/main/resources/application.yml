spring:
  application:
    name: sgiu

  datasource:
    url: jdbc:mariadb://localhost:3306/sgiu_db
    username: sgiu_user
    password: sgiu_1234
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always