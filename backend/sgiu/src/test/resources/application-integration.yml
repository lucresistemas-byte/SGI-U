# Perfil para tests contra MariaDB real. NUNCA apuntar a la base instalada
# (puerto 3307 / sgiu_db): la URL jdbc:tc: levanta un contenedor descartable
# de Testcontainers por cada ejecución (requiere Docker accesible).
spring:
  datasource:
    url: jdbc:tc:mariadb:10.11:///sgiu_it
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  # Mismo camino que producción: Flyway crea el esquema y Hibernate valida.
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
    show-sql: false
  sql:
    init:
      mode: never
