spring:
  datasource:
    url: jdbc:h2:mem:sgiu_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # Tests rápidos en H2: el esquema lo genera Hibernate (H2 no acepta todo el
  # DDL de MariaDB). Flyway se verifica contra MariaDB con Testcontainers.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: never

sgiu:
  backup:
    catchup:
      enabled: false

