server:
  port: 3000
  address: 0.0.0.0

jwt:
  secret: a7b8C9d0E1f2G3h4I5j6K7l8M9n0O1p2Q3r4S5t6U7v=
  expiration: 3600000

spring:
  application:
    name: sgiu

  datasource:
    url: jdbc:mariadb://localhost:3306/sgiu_db
    username: sgiu_user
    password: sgiu_1234
    driver-class-name: org.mariadb.jdbc.Driver

  # El esquema lo crea y versiona Flyway (db/migration); Hibernate solo valida.
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

    show-sql: true

  # Sin data.sql: los datos de ejemplo solo se cargan con el perfil "demo".
  sql:
    init:
      mode: never

logging:
  level:
    org:
      springframework:
        security: DEBUG