server:
  port: 3000
  address: 0.0.0.0

# A2: el secreto JWT no tiene default en el repo. Cada instalación genera el
# suyo (InstallationSecrets) o lo recibe por variable de entorno.
jwt:
  secret: ${SGIU_JWT_SECRET:}
  expiration: ${SGIU_JWT_EXPIRATION:28800000} # 8 horas (decisión del equipo 2026-10-15)

# A2: CORS restringido a la allowlist de orígenes del frontend (sin "*").
sgiu:
  cors:
    allowed-origins: ${SGIU_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}

spring:
  application:
    name: sgiu
  config:
    import:
      - optional:file:secrets.properties
      - optional:classpath:secrets.properties

  # A2: sin defaults de credenciales en el repo. En Windows el Launcher inyecta
  # el password; en desarrollo (Docker) se usa SGIU_DB_PASSWORD del .env.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://${SGIU_DB_HOST:localhost}:${SGIU_DB_PORT:3306}/${SGIU_DB_NAME:sgiu_db}}
    username: ${SGIU_DB_USER:sgiu_user}
    password: ${SGIU_DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver

  # El esquema lo crea y versiona Flyway (db/migration); Hibernate solo valida.
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

    show-sql: true

  # Sin data.sql: los datos de ejemplo solo se cargan con el perfil "demo".
  sql:
    init:
      mode: never

logging:
  level:
    org:
      springframework:
        security: INFO
