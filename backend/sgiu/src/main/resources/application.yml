server:
  port: 3000
  address: 0.0.0.0

jwt:
  secret: ${SGIU_JWT_SECRET:a7b8C9d0E1f2G3h4I5j6K7l8M9n0O1p2Q3r4S5t6U7v=}
  expiration: ${SGIU_JWT_EXPIRATION:43200000} # 12 horas por defecto (43.200.000 ms)

spring:
  application:
    name: sgiu
  config:
    import:
      - optional:file:secrets.properties
      - optional:classpath:secrets.properties

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://${SGIU_DB_HOST:localhost}:${SGIU_DB_PORT:3306}/${SGIU_DB_NAME:sgiu_db}}
    username: ${SGIU_DB_USER:sgiu_user}
    password: ${SGIU_DB_PASSWORD:sgiu_1234}
    driver-class-name: org.mariadb.jdbc.Driver

  # El esquema lo crea y versiona Flyway (db/migration); Hibernate solo valida.
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

    show-sql: true

  # Sin data.sql: los datos de ejemplo solo se cargan con el perfil "demo".
  sql:
    init:
      mode: never

logging:
  level:
    org:
      springframework:
        security: INFO