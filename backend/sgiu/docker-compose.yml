services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: sgiu_db
      MARIADB_USER: sgiu_user
      MARIADB_PASSWORD: sgiu_1234
      # Solo desarrollo: la base no está expuesta fuera de la red interna del compose.
      MARIADB_ROOT_PASSWORD: sgiu_root_dev
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      # Puerta de inspección para el host (no choca con un MariaDB local en 3306).
      - "${MARIADB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/sgiu_db
      SPRING_DATASOURCE_USERNAME: sgiu_user
      SPRING_DATASOURCE_PASSWORD: sgiu_1234
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-demo}"
      SERVER_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: