name: sgi_u_frontend
description: Frontend Flutter para SGI-U - Sistema de Gestión Inteligente Unificado
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dio: ^5.4.0
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  pdf: ^3.10.0
  printing: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/login_background.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/sgi-u-favicon.png"