name: sgi_u_frontend
description: Frontend Flutter para SGI-U - Sistema de Gestión Inteligente Unificado
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI y gestión de estado
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Íconos de Material
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true